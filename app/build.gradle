plugins { id 'com.android.application' }
android {
    ndkVersion '28.1.13356709'
    ndkPath rootProject.file('.local/native/ndk/android-ndk-r28b').absolutePath
    namespace 'dev.outpost.app'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.outpost.app'
        minSdk 28
        targetSdk 35
        versionCode 23
        versionName '0.19.0-rc3'
        ndk { abiFilters 'x86_64', 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_shared' }
        }
        testInstrumentationRunner 'dev.outpost.app.GenerationInstrumentation'
    }
    // Release and its isolated QA twin share production native code and assets.
    buildTypes {
        debug { externalNativeBuild { cmake { arguments '-DOUTPOST_RESEARCH=ON' } } }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            signingConfig null
            externalNativeBuild { cmake { arguments '-DOUTPOST_RESEARCH=OFF' } }
        }
        regressionQa {
            initWith debug
            applicationIdSuffix '.regressionqa'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        releaseQa {
            initWith release
            applicationIdSuffix '.releaseqa'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    if (providers.gradleProperty('outpostRegressionTest').isPresent()) { testBuildType 'regressionQa' }
    if (providers.gradleProperty('outpostReleaseTest').isPresent()) {
        testBuildType 'releaseQa'
        defaultConfig.testInstrumentationRunner 'dev.outpost.app.ReleaseInstrumentation'
        sourceSets.androidTest {
            java.setSrcDirs(['src/releaseTest/java'])
            assets.setSrcDirs(['src/releaseTest/assets'])
            manifest.srcFile 'src/releaseTest/AndroidManifest.xml'
        }
    }
    sourceSets.androidTest.java.srcDir 'src/testSupport/java'
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}

// Keep Java literals consistent across Windows and other build hosts.
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }
